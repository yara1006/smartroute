<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { fill: #1a1a2e; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .sub { fill: #666; font-family: system-ui, sans-serif; font-size: 11px; }
      .box-entry { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.5; }
      .box-agent { fill: #fff8e1; stroke: #f9a825; stroke-width: 1.5; }
      .box-svc { fill: #e8f5e9; stroke: #388e3c; stroke-width: 1.5; }
      .box-core { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.5; }
      .box-ext { fill: #fce4ec; stroke: #c2185b; stroke-width: 1.5; }
      .label-en { fill: #333; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .label-cn { fill: #666; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .api-text { fill: #333; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .api-sub { fill: #666; font-family: system-ui, sans-serif; font-size: 10px; text-anchor: middle; }
      .arrow { stroke: #999; stroke-width: 1.5; fill: none; }
      .section-label { fill: #999; font-family: system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="580" rx="4"/>
  <text x="400" y="32" class="title" text-anchor="middle">SmartRoute AI — System Architecture</text>

  <!-- ===== ENTRY POINTS ===== -->
  <text x="16" y="62" class="section-label">ENTRY POINTS</text>

  <rect class="box-entry" x="30" y="72" width="170" height="48" rx="8"/>
  <text x="115" y="93" class="label-en">Search</text>
  <text x="115" y="108" class="label-cn">搜索页</text>

  <rect class="box-entry" x="210" y="72" width="170" height="48" rx="8"/>
  <text x="295" y="93" class="label-en">XiaoTuan</text>
  <text x="295" y="108" class="label-cn">问小团</text>

  <rect class="box-entry" x="390" y="72" width="170" height="48" rx="8"/>
  <text x="475" y="93" class="label-en">Favorites</text>
  <text x="475" y="108" class="label-cn">收藏夹</text>

  <rect class="box-entry" x="570" y="72" width="200" height="48" rx="8"/>
  <text x="670" y="93" class="label-en">POI Detail</text>
  <text x="670" y="108" class="label-cn">POI 详情页</text>

  <!-- Arrows down -->
  <line class="arrow" x1="115" y1="120" x2="115" y2="148" marker-end="url(#ah)"/>
  <line class="arrow" x1="295" y1="120" x2="295" y2="148" marker-end="url(#ah)"/>
  <line class="arrow" x1="475" y1="120" x2="475" y2="148" marker-end="url(#ah)"/>
  <line class="arrow" x1="670" y1="120" x2="670" y2="148" marker-end="url(#ah)"/>

  <!-- ===== API LAYER ===== -->
  <text x="16" y="172" class="section-label">API LAYER</text>

  <rect class="box-core" x="100" y="156" width="600" height="40" rx="8"/>
  <text x="400" y="172" class="api-text">FastAPI 路由层</text>
  <text x="400" y="187" class="api-sub">/api/plan · /api/adjust · /api/search-preview · /api/route-intent</text>

  <!-- Arrow down -->
  <line class="arrow" x1="400" y1="196" x2="400" y2="228" marker-end="url(#ah)"/>

  <!-- ===== AGENT SYSTEM ===== -->
  <text x="16" y="252" class="section-label">AGENT SYSTEM</text>

  <rect class="box-agent" x="16" y="236" width="180" height="48" rx="8"/>
  <text x="106" y="257" class="label-en">RouteIntentRouter</text>
  <text x="106" y="272" class="label-cn">意图置信度分流</text>

  <rect class="box-agent" x="206" y="236" width="180" height="48" rx="8"/>
  <text x="296" y="257" class="label-en">IntentParser</text>
  <text x="296" y="272" class="label-cn">DeepSeek + 规则兜底</text>

  <rect class="box-agent" x="396" y="236" width="180" height="48" rx="8"/>
  <text x="486" y="257" class="label-en">POIRetriever</text>
  <text x="486" y="272" class="label-cn">本地向量检索</text>

  <rect class="box-agent" x="586" y="236" width="198" height="48" rx="8"/>
  <text x="685" y="257" class="label-en">RoutePlanner</text>
  <text x="685" y="272" class="label-cn">贪心 TSP O(n²)</text>

  <!-- Arrows between agents -->
  <line class="arrow" x1="196" y1="260" x2="206" y2="260" marker-end="url(#ah)"/>
  <line class="arrow" x1="386" y1="260" x2="396" y2="260" marker-end="url(#ah)"/>
  <line class="arrow" x1="576" y1="260" x2="586" y2="260" marker-end="url(#ah)"/>

  <!-- Arrows down -->
  <line class="arrow" x1="106" y1="284" x2="106" y2="320" marker-end="url(#ah)"/>
  <line class="arrow" x1="296" y1="284" x2="296" y2="320" marker-end="url(#ah)"/>
  <line class="arrow" x1="486" y1="284" x2="486" y2="320" marker-end="url(#ah)"/>
  <line class="arrow" x1="685" y1="284" x2="685" y2="320" marker-end="url(#ah)"/>

  <!-- ===== SERVICES ===== -->
  <text x="16" y="348" class="section-label">SERVICES</text>

  <rect class="box-svc" x="10" y="328" width="120" height="44" rx="8"/>
  <text x="70" y="346" class="label-en">profile_svc</text>
  <text x="70" y="361" class="label-cn">画像管理</text>

  <rect class="box-svc" x="140" y="328" width="120" height="44" rx="8"/>
  <text x="200" y="346" class="label-en">anchor_svc</text>
  <text x="200" y="361" class="label-cn">地点解析</text>

  <rect class="box-svc" x="270" y="328" width="120" height="44" rx="8"/>
  <text x="330" y="346" class="label-en">route_builder</text>
  <text x="330" y="361" class="label-cn">动态构建</text>

  <rect class="box-svc" x="400" y="328" width="120" height="44" rx="8"/>
  <text x="460" y="346" class="label-en">adjustment</text>
  <text x="460" y="361" class="label-cn">路线调整</text>

  <rect class="box-svc" x="530" y="328" width="120" height="44" rx="8"/>
  <text x="590" y="346" class="label-en">trace</text>
  <text x="590" y="361" class="label-cn">Tool Trace</text>

  <rect class="box-svc" x="660" y="328" width="120" height="44" rx="8"/>
  <text x="720" y="346" class="label-en">insight</text>
  <text x="720" y="361" class="label-cn">路线分析</text>

  <!-- ===== INFRASTRUCTURE ===== -->
  <text x="16" y="440" class="section-label">INFRASTRUCTURE</text>

  <rect class="box-core" x="10" y="416" width="150" height="40" rx="8"/>
  <text x="85" y="441" class="label-cn">SQLite 用户画像</text>

  <rect class="box-core" x="170" y="416" width="170" height="40" rx="8"/>
  <text x="255" y="441" class="label-cn">本地 POI 向量索引</text>

  <rect class="box-ext" x="350" y="416" width="150" height="40" rx="8"/>
  <text x="425" y="441" class="label-en">DeepSeek API</text>

  <rect class="box-ext" x="510" y="416" width="170" height="40" rx="8"/>
  <text x="595" y="441" class="label-cn">高德 Web 服务</text>

  <rect class="box-core" x="690" y="416" width="100" height="40" rx="8"/>
  <text x="740" y="441" class="label-en">Settings</text>

  <!-- Arrows from services to infra -->
  <line class="arrow" x1="70" y1="372" x2="85" y2="416" marker-end="url(#ah)"/>
  <line class="arrow" x1="200" y1="372" x2="255" y2="416" marker-end="url(#ah)"/>
  <line class="arrow" x1="330" y1="372" x2="425" y2="416" marker-end="url(#ah)"/>
  <line class="arrow" x1="460" y1="372" x2="595" y2="416" marker-end="url(#ah)"/>

  <!-- ===== Color Legend ===== -->
  <line x1="16" y1="486" x2="784" y2="486" stroke="#eee" stroke-width="1"/>

  <rect fill="#e3f2fd" stroke="#1976d2" stroke-width="1" width="14" height="14" x="16" y="502" rx="3"/>
  <text x="36" y="513" class="label-cn" font-size="10">入口层</text>
  <rect fill="#fff8e1" stroke="#f9a825" stroke-width="1" width="14" height="14" x="100" y="502" rx="3"/>
  <text x="120" y="513" class="label-cn" font-size="10">Agent</text>
  <rect fill="#e8f5e9" stroke="#388e3c" stroke-width="1" width="14" height="14" x="184" y="502" rx="3"/>
  <text x="204" y="513" class="label-cn" font-size="10">服务层</text>
  <rect fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1" width="14" height="14" x="268" y="502" rx="3"/>
  <text x="288" y="513" class="label-cn" font-size="10">基础设施</text>
  <rect fill="#fce4ec" stroke="#c2185b" stroke-width="1" width="14" height="14" x="352" y="502" rx="3"/>
  <text x="372" y="513" class="label-cn" font-size="10">外部服务</text>
</svg>
