<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { fill: #1a1a2e; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .sub { fill: #666; font-family: system-ui, sans-serif; font-size: 11px; }
      .box-entry { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.5; rx: 8; }
      .box-agent { fill: #fff8e1; stroke: #f9a825; stroke-width: 1.5; rx: 8; }
      .box-svc { fill: #e8f5e9; stroke: #388e3c; stroke-width: 1.5; rx: 8; }
      .box-core { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.5; rx: 8; }
      .box-ext { fill: #fce4ec; stroke: #c2185b; stroke-width: 1.5; rx: 8; }
      .box-text { fill: #333; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .box-text-b { fill: #333; font-family: system-ui, sans-serif; font-size: 10px; text-anchor: middle; font-weight: 600; }
      .arrow { stroke: #999; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .arrow-r { stroke: #f9a825; stroke-width: 1.5; fill: none; }
      .section-label { fill: #999; font-family: system-ui, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 1px; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <rect class="bg" width="720" height="480"/>
  <text x="360" y="28" class="title" text-anchor="middle">SmartRoute AI — System Architecture</text>

  <!-- Section labels -->
  <text x="16" y="56" class="section-label">ENTRY POINTS</text>
  <text x="16" y="126" class="section-label">API LAYER</text>
  <text x="16" y="226" class="section-label">AGENT SYSTEM</text>
  <text x="16" y="336" class="section-label">SERVICES</text>
  <text x="16" y="430" class="section-label">INFRASTRUCTURE</text>

  <!-- Entry Points Row -->
  <rect class="box-entry" x="30" y="62" width="130" height="44"/>
  <text x="95" y="80" class="box-text-b">搜索页</text>
  <text x="95" y="94" class="sub" text-anchor="middle">Search</text>

  <rect class="box-entry" x="170" y="62" width="130" height="44"/>
  <text x="235" y="80" class="box-text-b">问小团</text>
  <text x="235" y="94" class="sub" text-anchor="middle">XiaoTuan</text>

  <rect class="box-entry" x="310" y="62" width="130" height="44"/>
  <text x="375" y="80" class="box-text-b">收藏夹</text>
  <text x="375" y="94" class="sub" text-anchor="middle">Favorites</text>

  <rect class="box-entry" x="450" y="62" width="130" height="44"/>
  <text x="515" y="80" class="box-text-b">POI 详情页</text>
  <text x="515" y="94" class="sub" text-anchor="middle">Detail</text>

  <!-- Arrows down -->
  <line class="arrow" x1="95" y1="106" x2="95" y2="126"/>
  <line class="arrow" x1="235" y1="106" x2="235" y2="126"/>
  <line class="arrow" x1="375" y1="106" x2="375" y2="126"/>
  <line class="arrow" x1="515" y1="106" x2="515" y2="126"/>

  <!-- API Layer -->
  <rect class="box-core" x="130" y="132" width="460" height="44" rx="8"/>
  <text x="360" y="151" class="box-text-b">FastAPI 路由层</text>
  <text x="360" y="165" class="sub" text-anchor="middle">/api/plan · /api/adjust · /api/search-preview · /api/route-intent</text>

  <!-- Arrows down -->
  <line class="arrow" x1="360" y1="176" x2="360" y2="220"/>

  <!-- Agent System Row -->
  <rect class="box-agent" x="30" y="226" width="160" height="44"/>
  <text x="110" y="244" class="box-text-b">RouteIntentRouter</text>
  <text x="110" y="258" class="sub" text-anchor="middle">意图置信度分流</text>

  <rect class="box-agent" x="200" y="226" width="160" height="44"/>
  <text x="280" y="244" class="box-text-b">IntentParser</text>
  <text x="280" y="258" class="sub" text-anchor="middle">DeepSeek + 规则兜底</text>

  <rect class="box-agent" x="370" y="226" width="160" height="44"/>
  <text x="450" y="244" class="box-text-b">POIRetriever</text>
  <text x="450" y="258" class="sub" text-anchor="middle">本地向量检索</text>

  <rect class="box-agent" x="540" y="226" width="160" height="44"/>
  <text x="620" y="244" class="box-text-b">RoutePlanner</text>
  <text x="620" y="258" class="sub" text-anchor="middle">贪心 TSP O(n²)</text>

  <!-- Arrows between agents -->
  <line class="arrow" x1="190" y1="248" x2="200" y2="248"/>
  <line class="arrow" x1="360" y1="248" x2="370" y2="248"/>
  <line class="arrow" x1="530" y1="248" x2="540" y2="248"/>

  <!-- Arrows down -->
  <line class="arrow" x1="110" y1="270" x2="110" y2="330"/>
  <line class="arrow" x1="280" y1="270" x2="280" y2="330"/>
  <line class="arrow" x1="450" y1="270" x2="450" y2="330"/>
  <line class="arrow" x1="620" y1="270" x2="620" y2="330"/>

  <!-- Services Row -->
  <rect class="box-svc" x="20" y="336" width="110" height="44"/>
  <text x="75" y="354" class="box-text-b">profile_svc</text>
  <text x="75" y="368" class="sub" text-anchor="middle">画像管理</text>

  <rect class="box-svc" x="140" y="336" width="110" height="44"/>
  <text x="195" y="354" class="box-text-b">anchor_svc</text>
  <text x="195" y="368" class="sub" text-anchor="middle">地点解析</text>

  <rect class="box-svc" x="260" y="336" width="110" height="44"/>
  <text x="315" y="354" class="box-text-b">route_builder</text>
  <text x="315" y="368" class="sub" text-anchor="middle">动态构建</text>

  <rect class="box-svc" x="380" y="336" width="110" height="44"/>
  <text x="435" y="354" class="box-text-b">adjustment</text>
  <text x="435" y="368" class="sub" text-anchor="middle">路线调整</text>

  <rect class="box-svc" x="500" y="336" width="100" height="44"/>
  <text x="550" y="354" class="box-text-b">trace</text>
  <text x="550" y="368" class="sub" text-anchor="middle">Tool Trace</text>

  <rect class="box-svc" x="610" y="336" width="100" height="44"/>
  <text x="660" y="354" class="box-text-b">insight</text>
  <text x="660" y="368" class="sub" text-anchor="middle">路线分析</text>

  <!-- Infrastructure Row -->
  <rect class="box-core" x="30" y="436" width="140" height="36"/>
  <text x="100" y="457" class="box-text-b">SQLite 用户画像</text>

  <rect class="box-core" x="180" y="436" width="140" height="36"/>
  <text x="250" y="457" class="box-text-b">本地 POI 向量索引</text>

  <rect class="box-ext" x="330" y="436" width="140" height="36"/>
  <text x="400" y="457" class="box-text-b">DeepSeek API</text>

  <rect class="box-ext" x="480" y="436" width="140" height="36"/>
  <text x="550" y="457" class="box-text-b">高德 Web 服务</text>

  <rect class="box-core" x="630" y="436" width="80" height="36"/>
  <text x="670" y="457" class="box-text-b">Settings</text>

  <!-- Arrows from services to infra -->
  <line class="arrow" x1="75" y1="380" x2="100" y2="436"/>
  <line class="arrow" x1="195" y1="380" x2="250" y2="436"/>
  <line class="arrow" x1="315" y1="380" x2="400" y2="436"/>
  <line class="arrow" x1="435" y1="380" x2="550" y2="436"/>

  <!-- Color legend -->
  <rect fill="#e3f2fd" stroke="#1976d2" stroke-width="1" width="12" height="12" x="16" y="468" rx="2"/>
  <text x="34" y="478" class="sub" font-size="10">入口层</text>
  <rect fill="#fff8e1" stroke="#f9a825" stroke-width="1" width="12" height="12" x="90" y="468" rx="2"/>
  <text x="108" y="478" class="sub" font-size="10">Agent</text>
  <rect fill="#e8f5e9" stroke="#388e3c" stroke-width="1" width="12" height="12" x="160" y="468" rx="2"/>
  <text x="178" y="478" class="sub" font-size="10">服务层</text>
  <rect fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1" width="12" height="12" x="230" y="468" rx="2"/>
  <text x="248" y="478" class="sub" font-size="10">基础设施</text>
  <rect fill="#fce4ec" stroke="#c2185b" stroke-width="1" width="12" height="12" x="320" y="468" rx="2"/>
  <text x="338" y="478" class="sub" font-size="10">外部服务</text>
</svg>
